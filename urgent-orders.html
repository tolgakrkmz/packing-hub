<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задание · Package Hub</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/tasks.css"><link rel="stylesheet" href="css/urgent-orders.css"><link rel="stylesheet" href="css/i18n.css">
<script src="js/i18n-en.js"></script><script src="js/i18n.js" data-storage-key="portfolio-hub-language"></script>
<script src="js/shift-schedule.js" defer></script><script src="js/urgent-orders.js" defer></script>
<link rel="icon" type="image/svg+xml" href="assets/package-hub-mark.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/package-hub-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/brand-shell.css">
</head>
<body>
<main class="wrap tasks-wrap orders-wrap">
<header class="tasks-heading"><div><a class="hub-brand module-brand" href="index.html" translate="no"><img src="assets/package-hub-mark.svg" width="44" height="44" alt=""><span>Package <span class="brand-hub">Hub</span></span></a><p class="tasks-eyebrow">Организация на опаковката</p><h1>Задание</h1><p>Готови за опаковка поръчки, които трябва да тръгнат с камиона.</p></div><button id="newOrders" type="button">+ Добави поръчки</button></header>
<p id="orderMessage" role="status" aria-live="polite"></p>
<section id="orderList" class="order-list" aria-live="polite"></section>
<details id="packedSection" class="order-packed" hidden><summary>Опаковани <span id="packedCount" class="task-badge"></span></summary><div id="packedList"></div></details>
<dialog id="orderEditor" class="task-dialog">
<form id="orderForm"><div class="dialog-heading"><h2>Добави поръчки</h2><button type="button" data-close="orderEditor" class="secondary" aria-label="Затвори">×</button></div>
<label>Поръчки — по една на ред<textarea id="orderText" required rows="6" placeholder="напр. 4521 · профил 60×40 · 5 палета"></textarea></label>
<label>Камион на<input id="orderTruckDate" type="date" required></label>
<p id="editorFeedback" class="task-error" role="status"></p><div class="task-actions"><button type="submit">Запази</button><button type="button" data-close="orderEditor" class="secondary">Отказ</button></div>
</form></dialog>
</main></body></html>
