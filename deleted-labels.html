<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Изтрити етикети · Package Hub</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/tasks.css"><link rel="stylesheet" href="css/deleted-labels.css"><link rel="stylesheet" href="css/i18n.css">
<script src="js/i18n-en.js"></script><script src="js/i18n.js" data-storage-key="portfolio-hub-language"></script>
<script src="js/task-photos.js" defer></script><script src="js/deleted-labels.js" defer></script>
<link rel="icon" type="image/svg+xml" href="assets/package-hub-mark.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/package-hub-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/brand-shell.css">
</head>
<body>
<main class="wrap tasks-wrap labels-wrap">
<header class="tasks-heading"><div><a class="hub-brand module-brand" href="index.html" translate="no"><img src="assets/package-hub-mark.svg" width="44" height="44" alt=""><span>Package <span class="brand-hub">Hub</span></span></a><p class="tasks-eyebrow">Организация на опаковката</p><h1>Изтрити етикети</h1><p>Сложи етикета със снимка — така всички знаят веднага, че е за изтриване.</p></div></header>
<p id="labelMessage" role="status" aria-live="polite"></p>
<form id="labelForm" class="label-composer" hidden>
<h2>Нов етикет за изтриване</h2>
<fieldset class="task-photo-picker"><legend>Снимка на етикета (задължителна)</legend><div class="task-fields"><label>Снимай<input id="labelCamera" type="file" accept="image/*" capture="environment"></label><label>Избери снимка<input id="labelPhoto" type="file" accept="image/*"></label></div><p id="labelPhotoCount" class="task-muted" role="status" translate="no" hidden></p><div id="labelPhotoPreview" class="task-photo-choices"></div><p id="labelPhotoInfo" class="task-muted" role="status"></p><button id="labelPhotoClear" type="button" class="secondary" hidden>Премахни избора</button></fieldset>
<label>Бележка (по желание)<input id="labelText" maxlength="300" placeholder="напр. номер на етикета или причина"></label>
<p id="actionFeedback" class="task-error" role="status"></p><div class="task-actions"><button type="submit">Добави етикета</button></div>
</form>
<section id="labelList" class="label-group" aria-live="polite"></section>
<details id="deletedSection" class="label-deleted" hidden><summary>Изтрити <span id="deletedCount" class="task-badge"></span></summary><div id="deletedList" class="label-group"></div></details>
<dialog id="taskPhotoViewer" class="task-dialog task-photo-viewer"><div class="dialog-heading"><h2 id="photoViewerTitle">Снимка на етикет</h2><button type="button" data-close="taskPhotoViewer" class="secondary" aria-label="Затвори">×</button></div><img id="photoViewerImage" alt=""><p id="photoViewerFeedback" role="status"></p></dialog>
</main></body></html>
